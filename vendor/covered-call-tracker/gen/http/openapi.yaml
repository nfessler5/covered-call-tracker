swagger: "2.0"
info:
    title: Covered Call Tracker API
    description: API for tracking underlying stock cost basis, option positions, and contract rolls.
    version: 0.0.1
host: localhost:8080
basePath: /
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /api/v1/scanner/run:
        post:
            tags:
                - scanner
            summary: scan scanner
            operationId: scanner#scan
            parameters:
                - name: ScanRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/ScannerScanRequestBody'
                    required:
                        - tickers
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/Candidate'
            schemes:
                - http
    /positions:
        get:
            tags:
                - positions
            summary: list positions
            description: List active or historical covered call positions.
            operationId: positions#list
            parameters:
                - name: status
                  in: query
                  description: Filter by status (OPEN, EXPIRED, ASSIGNED, ROLLED, CLOSED)
                  required: false
                  type: string
            responses:
                "200":
                    description: OK response.
                    schema:
                        type: array
                        items:
                            $ref: '#/definitions/CoveredCallPosition'
            schemes:
                - http
        post:
            tags:
                - positions
            summary: create positions
            description: Open a new covered call position.
            operationId: positions#create
            parameters:
                - name: CreateRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/CoveredCallPosition'
                    required:
                        - underlying_id
                        - strike_price
                        - expiration_date
                        - premium_collected
                        - contracts_count
                        - status
            responses:
                "201":
                    description: Created response.
                    schema:
                        $ref: '#/definitions/CoveredCallPosition'
                        required:
                            - underlying_id
                            - strike_price
                            - expiration_date
                            - premium_collected
                            - contracts_count
                            - status
            schemes:
                - http
    /positions/{id}/roll:
        post:
            tags:
                - positions
            summary: roll positions
            description: Close an existing position as ROLLED and create a new open position in one atomic transaction.
            operationId: positions#roll
            parameters:
                - name: id
                  in: path
                  description: ID of the position being rolled
                  required: true
                  type: integer
                  format: int64
                - name: RollRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/PositionsRollRequestBody'
                    required:
                        - roll_details
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/CoveredCallPosition'
                        required:
                            - underlying_id
                            - strike_price
                            - expiration_date
                            - premium_collected
                            - contracts_count
                            - status
            schemes:
                - http
    /users/{id}:
        get:
            tags:
                - users
            summary: get users
            description: Get user profile by ID.
            operationId: users#get
            parameters:
                - name: id
                  in: path
                  description: User ID
                  required: true
                  type: integer
                  format: int64
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/User'
                        required:
                            - id
                            - email
                            - username
            schemes:
                - http
definitions:
    Candidate:
        title: Candidate
        type: object
        properties:
            annualized_yield:
                type: number
                description: Calculated annualized return yield %
                example: 0.24367532004668518
                format: double
            expiration_date:
                type: string
                description: Expiration Date (YYYY-MM-DD)
                example: Aut ab.
            premium:
                type: number
                description: Option Premium Price
                example: 0.6706985643311775
                format: double
            stock_price:
                type: number
                description: Current underlying stock price
                example: 0.5019569953013899
                format: double
            strike_price:
                type: number
                description: Option Strike Price
                example: 0.7013755349796843
                format: double
            ticker:
                type: string
                description: Stock Ticker Symbol
                example: Sit molestiae blanditiis atque atque enim.
        description: A potential covered call candidate found by the scanning engine.
        example:
            annualized_yield: 0.24367532004668518
            expiration_date: Aut ab.
            premium: 0.6706985643311775
            stock_price: 0.5019569953013899
            strike_price: 0.7013755349796843
            ticker: Sit molestiae blanditiis atque atque enim.
        required:
            - ticker
            - stock_price
            - strike_price
            - expiration_date
            - premium
            - annualized_yield
    CoveredCallPosition:
        title: CoveredCallPosition
        type: object
        properties:
            contracts_count:
                type: integer
                description: Number of contracts sold
                example: 1
                format: int64
            expiration_date:
                type: string
                description: Expiration Date (YYYY-MM-DD)
                example: "2026-09-18"
            id:
                type: integer
                description: Unique Position ID
                example: 10
                format: int64
            premium_collected:
                type: number
                description: Total premium collected for the contracts
                example: 150
                format: double
            status:
                type: string
                description: 'Status: OPEN, EXPIRED, ASSIGNED, ROLLED, CLOSED'
                example: OPEN
            strike_price:
                type: number
                description: Option Strike Price
                example: 30
                format: double
            underlying_id:
                type: integer
                description: ID of the underlying stock
                example: 1
                format: int64
        description: An open or historical covered call options contract.
        example:
            contracts_count: 1
            expiration_date: "2026-09-18"
            id: 10
            premium_collected: 150
            status: OPEN
            strike_price: 30
            underlying_id: 1
        required:
            - underlying_id
            - strike_price
            - expiration_date
            - premium_collected
            - contracts_count
            - status
    PositionsRollRequestBody:
        title: PositionsRollRequestBody
        type: object
        properties:
            roll_details:
                $ref: '#/definitions/RollPositionPayload'
        example:
            roll_details:
                net_credit: 45
                new_expiration_date: "2026-09-25"
                new_strike_price: 32
        required:
            - roll_details
    RollPositionPayload:
        title: RollPositionPayload
        type: object
        properties:
            net_credit:
                type: number
                description: Net credit collected (or debit paid) during the roll
                example: 45
                format: double
            new_expiration_date:
                type: string
                description: New expiration date (YYYY-MM-DD)
                example: "2026-09-25"
            new_strike_price:
                type: number
                description: New strike price
                example: 32
                format: double
        description: Parameters required to roll an existing position into a new expiration and strike.
        example:
            net_credit: 45
            new_expiration_date: "2026-09-25"
            new_strike_price: 32
        required:
            - new_strike_price
            - new_expiration_date
            - net_credit
    ScannerScanRequestBody:
        title: ScannerScanRequestBody
        type: object
        properties:
            min_annualized_yield:
                type: number
                description: Minimum annual return yield %
                example: 0.826306896283667
                format: double
            tickers:
                type: array
                items:
                    type: string
                    example: Rerum sit placeat est delectus assumenda.
                description: List of tickers to scan
                example:
                    - Rerum sit placeat est delectus assumenda.
                    - Dolorem ut dolorem perspiciatis.
                    - Quaerat perspiciatis quia ipsum tempore alias.
                    - Excepturi iusto minus.
        example:
            min_annualized_yield: 0.826306896283667
            tickers:
                - Rerum sit placeat est delectus assumenda.
                - Dolorem ut dolorem perspiciatis.
                - Quaerat perspiciatis quia ipsum tempore alias.
                - Excepturi iusto minus.
        required:
            - tickers
    User:
        title: User
        type: object
        properties:
            email:
                type: string
                description: User Email Address
                example: user@example.com
            id:
                type: integer
                description: Unique User ID
                example: 1
                format: int64
            username:
                type: string
                description: Username
                example: trader123
        description: User profile details
        example:
            email: user@example.com
            id: 1
            username: trader123
        required:
            - id
            - email
            - username
