<!DOCTYPE html>
<html lang="en" class="bg-slate-900 text-slate-100 dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Covered Call Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body class="p-8">
    <header class="mb-8 border-b border-slate-700 pb-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-emerald-400">Covered Call Dashboard</h1>
            <p class="text-sm text-slate-400">Option Income & Cost Basis Tracker</p>
        </div>
        <div class="flex items-center gap-2">
            <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
            <span class="text-xs text-slate-400 uppercase tracking-wider font-semibold">Live Polling</span>
        </div>
    </header>

    <main id="content">
        {{ template "content" . }}
    </main>
</body>
</html>
